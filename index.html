
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPEN ME, PLS ♡</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="floating-decor decor-one">♡</div>
  <div class="floating-decor decor-two">✦</div>
  <div class="floating-decor decor-three">୨୧</div>
  <div class="floating-decor decor-four">♡</div>

  <main class="app">
    <!-- PAGE 1: INVITATION -->
    <section id="welcomeScreen" class="screen welcome-screen active">
      <div class="welcome-card">
        <div class="envelope">💌</div>
        <button id="openButton" class="main-button">OPEN ME ♡</button>
      </div>
    </section>

    <!-- PAGE 2: SONG CHOICES -->
    <section id="choiceScreen" class="screen choice-screen">
      <header class="page-header">
        <p class="eyebrow">PICK WHAT YOUR HEART FEELS</p>
        <h2>Choose a little <span>moment</span></h2>
        <p>Every song holds a different story. ♡</p>
      </header>

      <div class="song-grid">
        <button class="choice-card christmas-choice" data-song="0" aria-label="Play song 1">
          <span class="choice-emoji">❄️</span>
          <span class="choice-arrow">↗</span>
        </button>

        <button class="choice-card storm-choice" data-song="1" aria-label="Play song 2">
          <span class="choice-emoji">⛈️</span>
          <span class="choice-arrow">↗</span>
        </button>

        <button class="choice-card autumn-choice" data-song="2" aria-label="Play song 3">
          <span class="choice-emoji">🍂</span>
          <span class="choice-arrow">↗</span>
        </button>

        <button class="choice-card muli-choice" data-song="3" aria-label="Play song 4">
          <span class="choice-emoji">🥃</span>
          <span class="choice-arrow">↗</span>
        </button>

        <button class="choice-card missing-choice" data-song="4" aria-label="Play song 5">
          <span class="choice-emoji">🌧️</span>
          <span class="choice-arrow">↗</span>
        </button>

        <button class="choice-card road-choice" data-song="5" aria-label="Play song 6">
          <span class="choice-emoji">🌙</span>
          <span class="choice-arrow">↗</span>
        </button>
      </div>

      <button id="homeButton" class="text-button">← Back to the beginning</button>
    </section>

    <!-- PAGE 3: LYRICS AND ANIMATED BACKGROUNDS -->
    <section id="lyricsScreen" class="screen lyrics-screen">
      <button id="backButton" class="back-button">← All songs</button>

      <article id="lyricsCard" class="lyrics-card">
        <div id="christmasScene" class="scene christmas-scene" aria-hidden="true">
          <div class="christmas-moon"></div>
          <div class="christmas-stars">✦　·　✧　·　✦</div>
          <div class="snow-layer snow-one"></div>
          <div class="snow-layer snow-two"></div>
          <div class="snow-layer snow-three"></div>
          <div class="christmas-ground"></div>
          <div class="street-lamp"><span></span></div>
          <div class="telephone-booth">
            <div class="booth-roof"></div>
            <div class="booth-top-window"></div>
            <div class="booth-window"></div>
            <div class="booth-door"></div>
          </div>
          <div class="christmas-tree">
            <i></i><b></b><em></em><span>✦</span>
          </div>
          <div class="christmas-building"></div>
        </div>

        <div id="stormScene" class="scene storm-scene" aria-hidden="true">
          <div class="storm-cloud cloud-one"></div>
          <div class="storm-cloud cloud-two"></div>
          <div class="lightning"></div>
          <div class="rain-layer rain-one"></div>
          <div class="rain-layer rain-two"></div>
          <div class="storm-hills"></div>
          <div class="storm-house">
            <div class="house-roof"></div>
            <div class="house-body">
              <span class="house-window"></span>
              <span class="house-door"></span>
            </div>
          </div>
          <div class="storm-ground"></div>
        </div>

        <div id="autumnScene" class="scene autumn-scene" aria-hidden="true">
          <div class="autumn-sun"></div>
          <div class="autumn-hill"></div>
          <div class="autumn-tree">
            <div class="tree-trunk"></div>
            <div class="tree-branch branch-one"></div>
            <div class="tree-branch branch-two"></div>
            <div class="tree-crown crown-one"></div>
            <div class="tree-crown crown-two"></div>
            <div class="tree-crown crown-three"></div>
          </div>
          <div class="falling-leaves">
            <i>🍂</i><i>🍁</i><i>🍂</i><i>🍁</i><i>🍂</i><i>🍁</i>
          </div>
          <div class="autumn-ground"></div>
        </div>

        <div id="muliScene" class="scene muli-scene" aria-hidden="true">
          <div class="muli-wall-light"></div>
          <div class="muli-window"><span></span><i></i></div>
          <div class="muli-table">
            <div class="table-top"></div>
            <div class="table-leg leg-left"></div>
            <div class="table-leg leg-right"></div>
          </div>
          <div class="bottle bottle-one">
            <span class="bottle-neck"></span><span class="bottle-label"></span>
          </div>
          <div class="bottle bottle-two">
            <span class="bottle-neck"></span><span class="bottle-label"></span>
          </div>
          <div class="liquor-glass glass-one"><i></i></div>
          <div class="liquor-glass glass-two"><i></i></div>
          <div class="muli-candle"><i></i></div>
          <div class="muli-shadow"></div>
        </div>

        <div id="windowScene" class="scene window-scene" aria-hidden="true">
          <div class="window-night"></div>
          <div class="outside-moon"></div>
          <div class="outside-tree">
            <div class="outside-trunk"></div>
            <div class="outside-crown crown-a"></div>
            <div class="outside-crown crown-b"></div>
            <div class="outside-crown crown-c"></div>
          </div>
          <div class="window-frame">
            <div class="window-pane pane-one"></div>
            <div class="window-pane pane-two"></div>
            <div class="window-pane pane-three"></div>
            <div class="window-pane pane-four"></div>
            <div class="window-sill"></div>
          </div>
          <div class="curtain curtain-left"></div>
          <div class="curtain curtain-right"></div>
          <div class="window-leaves"><i>🍂</i><i>🍁</i><i>🍂</i><i>🍁</i></div>
          <div class="window-rain"></div>
        </div>

        <div id="roadScene" class="scene road-scene" aria-hidden="true">
          <div class="road-sky"></div>
          <div class="road-moon"></div>
          <div class="road-mountains"></div>
          <div class="road-light light-left"></div>
          <div class="road-light light-right"></div>
          <div class="highway">
            <div class="road-edge edge-left"></div>
            <div class="road-edge edge-right"></div>
            <div class="road-stripe stripe-one"></div>
            <div class="road-stripe stripe-two"></div>
            <div class="road-stripe stripe-three"></div>
            <div class="road-stripe stripe-four"></div>
            <div class="road-stripe stripe-five"></div>
          </div>
          <div class="road-dashboard"></div>
          <div class="dashboard-glow"></div>
        </div>

        <div class="lyrics-shade"></div>

        <div class="lyrics-content">
          <p id="lyricsText" class="lyrics-text">♡</p>
        </div>
      </article>

      <div class="player">
        <audio id="audioPlayer" preload="metadata"></audio>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
